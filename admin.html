<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mystique Collections — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<!-- data-admin="true" must be set server-side ONLY for signed-in admins. -->
<body data-admin="true">

  <button type="button" class="menu-toggle" id="menuToggle" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>

  <!-- ===== Sidebar / Deep Plum (Figma node 30:776) ===== -->
  <aside class="sidebar" id="sidebar" aria-label="Admin navigation">
    <div class="sidebar__bg" aria-hidden="true"><span class="sidebar__petal"></span></div>

    <div class="brand">
      <p class="brand__name">mystique</p>
      <p class="brand__sub">COLLECTIONS</p>
    </div>

    <nav class="nav">
      <a class="nav__item" href="dashboard.html" data-view="dashboard">Dashboard</a>
      <a class="nav__item" href="customers.html" data-view="customers">Customers</a>
      <a class="nav__item" href="product.html" data-view="products">Products</a>
      <a class="nav__item" href="inventory.html" data-view="inventory">Inventory</a>
      <a class="nav__item" href="orders-payments.html" data-view="orders">Orders &amp; Payments</a>
      <a class="nav__item" href="settings.html" data-view="settings">Settings</a>
      <a class="nav__item" href="reports.html" data-view="reports">Reports</a>

      <!-- NEW · admin only -->
      <p class="nav__label" data-admin-only>A D M I N</p>
      <button type="button" class="nav__item" id="openUserManager" data-admin-only
              aria-haspopup="dialog" aria-expanded="false" aria-controls="userManager">Manage Users</button>
    </nav>
  </aside>

  <main class="main" id="main">
    <h1 id="viewTitle">Inventory</h1>
    <p class="main__desc" id="viewDesc"></p>
    <div class="card"><p>Your existing page content goes here. The sidebar links above switch views without reloading.</p></div>
  </main>

  <!-- ===== Manage Users pop-up · admin only ===== -->
  <div class="um" id="userManager" data-admin-only hidden>
    <div class="um__backdrop" data-um-close></div>

    <section class="um__dialog" role="dialog" aria-modal="true" aria-labelledby="umTitle" aria-describedby="umDesc">
      <header class="um__head">
        <div>
          <h2 id="umTitle">Manage Users</h2>
          <p id="umDesc">Search for a user, then update their rank.</p>
        </div>
        <button type="button" class="um__close" data-um-close aria-label="Close">&times;</button>
      </header>

      <div class="um__body">
        <label class="um__search">
          <span class="sr-only">Search users</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="umSearch" type="search" placeholder="Search by name, email or ID" autocomplete="off" spellcheck="false">
        </label>

        <p class="um__count" id="umCount" aria-live="polite"></p>
        <ul class="um__list" id="umList"></ul>

        <form class="um__detail" id="umDetail" hidden novalidate>
          <div class="um__who">
            <span class="avatar" id="umAvatar" aria-hidden="true"></span>
            <div class="um__whoText">
              <p class="um__name" id="umName"></p>
              <p class="um__mail" id="umMail"></p>
            </div>
            <span class="badge" id="umBadge"></span>
          </div>

          <fieldset class="um__roles" id="umRoles"><legend>Change rank</legend></fieldset>

          <p class="um__note" id="umNote" hidden></p>
          <p class="um__error" id="umError" role="alert" hidden></p>

          <div class="um__actions">
            <button type="button" class="btn btn--ghost" id="umBack">Back to results</button>
            <button type="submit" class="btn" id="umSave" disabled>Save changes</button>
          </div>
        </form>
      </div>

      <div class="um__toast" id="umToast" role="status" aria-live="polite"></div>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
